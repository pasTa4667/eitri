[package]
name = "eitri-operator"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = { version = "=0.2.2", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
ureq = { version = "=3.1.2", default-features = false }
unicode-segmentation = "=1.12.0"
uuid = { version = "=1.18.1", features = ["v4"] }

[dev-dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["test-support"] }
